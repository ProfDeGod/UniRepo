<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Register - UniRepo</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background-color: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .register-container {
            width: 430px;
            margin: 80px auto;
        }

        .register-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            color: #0d47a1;
            font-size: 32px;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .register-button {
            width: 100%;
            padding: 12px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="register-container">

    <div class="register-card">

        <div class="logo">

            <i class="bi bi-journal-bookmark-fill"></i>

            UniRepo

        </div>

        <p class="subtitle">

            Create your account

        </p>

        <div
                th:if="${error}"
                class="alert alert-danger"
                th:text="${error}">

            Error

        </div>

        <form
                th:action="@{/register}"
                method="post">

            <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">

            <div class="mb-3">

                <label
                        for="username"
                        class="form-label">

                    Username

                </label>

                <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        required>

            </div>

            <div class="mb-4">

                <label
                        for="password"
                        class="form-label">

                    Password

                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        required>

            </div>

            <button
                    type="submit"
                    class="btn btn-primary register-button">

                <i class="bi bi-person-plus"></i>

                Create Account

            </button>

        </form>

        <div class="login-link">

            Already have an account?

            <a href="/login">
                Login here
            </a>

        </div>

    </div>

</div>

</body>
</html>
