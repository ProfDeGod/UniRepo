<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Login - UniRepo</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background-color: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 430px;
            margin: 100px auto;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            color: #0d47a1;
            font-size: 32px;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <i class="bi bi-journal-bookmark-fill"></i>
            UniRepo
        </div>

        <p class="subtitle">
            Academic Research Repository
        </p>

        <div
                th:if="${param.registered}"
                class="alert alert-success">

            Registration successful.
            Please login.

        </div>

        <div
                th:if="${param.error}"
                class="alert alert-danger">

            Invalid username or password.

        </div>

        <div
                th:if="${param.logout}"
                class="alert alert-info">

            You have been logged out.

        </div>

        <form
                th:action="@{/login}"
                method="post">

            <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">

            <div class="mb-3">

                <label
                        for="username"
                        class="form-label">

                    Username

                </label>

                <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        required>

            </div>

            <div class="mb-4">

                <label
                        for="password"
                        class="form-label">

                    Password

                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        required>

            </div>

            <button
                    type="submit"
                    class="btn btn-primary login-button">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="/register">
                Register here
            </a>

        </div>

    </div>

</div>

</body>
</html>
